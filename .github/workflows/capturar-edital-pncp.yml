name: Capturar edital PNCP (reutilizável)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do edital no PNCP"
        required: true
        type: string
      baixar_anexos:
        description: "Tentar baixar os anexos disponíveis"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: capturar-edital-pncp
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install requests openpyxl
      - name: Validar sintaxe
        run: python -m py_compile scripts/capturar_edital_pncp.py
      - name: Capturar contratação
        env:
          PNCP_URL: ${{ inputs.url }}
          BAIXAR_ANEXOS: ${{ inputs.baixar_anexos }}
        run: |
          if [ "$BAIXAR_ANEXOS" = "true" ]; then
            python scripts/capturar_edital_pncp.py --url "$PNCP_URL" --download-files
          else
            python scripts/capturar_edital_pncp.py --url "$PNCP_URL"
          fi
      - name: Publicar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EDITAIS/
          if ! git diff --cached --quiet; then
            git commit -m "data: capturar edital PNCP solicitado"
            git pull --rebase origin main
            git push
          else
            echo "Sem alterações para publicar."
          fi
      - name: Arquivar resultados da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura-edital-pncp
          path: EDITAIS/
          if-no-files-found: warn
          retention-days: 30
