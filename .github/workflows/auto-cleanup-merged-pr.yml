name: Automatically finalize merged pull requests

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete source branch after successful merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const branch = pr.head.ref;

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted merged source branch: ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Source branch already deleted: ${branch}`);
              } else {
                throw error;
              }
            }
