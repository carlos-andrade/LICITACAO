name: Validacao do Sistema LICITACAO

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia de schemas
        run: python -m pip install --upgrade pip jsonschema -r scripts/requirements.txt
      - name: Executar testes unitarios
        run: python -m unittest discover -s scripts/tests -v
      - name: Validar schemas e exemplos
        run: python scripts/validate_schemas.py
