name: Validacao do Sistema LICITACAO

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalizar cabeçalhos e gerar inventário documental
        run: python scripts/normalize_document_headers.py --write
      - name: Publicar normalização documental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "docs: normalizar cabeçalhos e inventariar conformidade"
            git push
          fi
      - name: Instalar dependencia de schemas
        run: python -m pip install --upgrade pip jsonschema -r scripts/requirements.txt
      - name: Executar testes unitarios
        run: python -m unittest discover -s scripts/tests -v
      - name: Validar schemas e exemplos
        run: python scripts/validate_schemas.py
