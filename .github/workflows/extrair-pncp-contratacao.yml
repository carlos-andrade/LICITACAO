name: Extrair contratação específica PNCP

on:
  push:
    paths:
      - "scripts/capture_pncp_contratacao.py"
      - ".github/workflows/extrair-pncp-contratacao.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "URL da contratação PNCP"
        required: true
        default: "https://pncp.gov.br/app/editais/00394502000144/2026/14259"

permissions:
  contents: write

concurrency:
  group: extrair-pncp-contratacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install requests openpyxl
      - name: Validar sintaxe
        run: python -m py_compile scripts/capture_pncp_contratacao.py
      - name: Extrair dados da contratação
        env:
          CONTRATACAO_URL: ${{ inputs.url || 'https://pncp.gov.br/app/editais/00394502000144/2026/14259' }}
        run: python scripts/capture_pncp_contratacao.py --url "$CONTRATACAO_URL"
      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EDITAIS/CONTRATACAO-00394502000144-2026-14259
          if ! git diff --cached --quiet; then
            git commit -m "data: extrair contratação PNCP específica"
            git push
          else
            echo "Sem alterações nos resultados."
          fi
      - name: Arquivar resultados da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pncp-contratacao-00394502000144-2026-14259
          path: EDITAIS/CONTRATACAO-00394502000144-2026-14259
          if-no-files-found: warn
          retention-days: 30
