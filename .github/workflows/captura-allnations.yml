name: Captura de catálogo ALLNATIONS

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Limite máximo de páginas a visitar"
        required: true
        default: "1000"
      delay:
        description: "Intervalo em segundos entre requisições"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4
      - name: Validar sintaxe do coletor
        run: python -m py_compile scripts/capture_allnations_catalog.py
      - name: Executar captura ALLNATIONS (login opcional via secrets)
        env:
          ALLNATIONS_EMAIL: ${{ secrets.ALLNATIONS_EMAIL }}
          ALLNATIONS_PASSWORD: ${{ secrets.ALLNATIONS_PASSWORD }}
          MAX_PAGES: ${{ inputs.max_pages }}
          CRAWL_DELAY: ${{ inputs.delay }}
        run: |
          python scripts/capture_allnations_catalog.py --max-pages "$MAX_PAGES" --delay "$CRAWL_DELAY"
      - name: Publicar ficheiros capturados se o coletor chegou ao fim sem erro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORNECEDORES/allnations-produtos.csv FORNECEDORES/allnations-produtos.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar catálogo ALLNATIONS"
            git push
          else
            echo "Não houve alterações nos resultados capturados."
          fi
      - name: Guardar resultados como artefacto para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allnations-catalog-capture
          path: |
            FORNECEDORES/allnations-produtos.csv
            FORNECEDORES/allnations-produtos.json
          if-no-files-found: warn
          retention-days: 30
